name: Build SantyWin Bingo Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "SantyWin-Bingo.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Build Android APK
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../SantyWin-Bingo.apk

      - name: Commit SantyWin-Bingo.apk to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SantyWin-Bingo.apk
          git diff --staged --quiet || (git commit -m "build(android): add compiled SantyWin-Bingo.apk" && git push origin HEAD:main)

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantyWin-Bingo-APK
          path: SantyWin-Bingo.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-apk
          name: "📱 SantyWin Bingo para Android (SantyWin-Bingo.apk)"
          body: |
            Descarga directa del instalador **`SantyWin-Bingo.apk`** para teléfonos Android.
          files: SantyWin-Bingo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
