name: Build SantyWin Bingo Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Generate Android Native Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK (Debug Installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SantyWin-Bingo.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantyWin-Bingo-APK
          path: android-app/SantyWin-Bingo.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-apk
          name: "📱 SantyWin Bingo para Android (APK Instalable)"
          body: |
            Descarga directa del archivo **`SantyWin-Bingo.apk`** optimizado para teléfonos Android (con pantalla siempre activa, vibración háptica, vista de 2 cartones por fila, marcado rápido al alcance del pulgar y sincronización con Firebase `santywin-bingo-2026`).
          files: android-app/SantyWin-Bingo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
